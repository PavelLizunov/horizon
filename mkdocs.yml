site_name: Digest Ninitux
# Deliberately says nothing about cadence, source count or subject matter: all
# three are configuration. The previous line promised a *daily* digest of
# *technology and research* from *a dozen sources*, while the schedule is a
# launchd entry, the enabled sources are four plus three feeds, and
# `finance-news` is one of the profiles. A description of the method survives
# reconfiguration; a description of the contents goes stale silently.
site_description: Материалы из моих источников, отобранные и разобранные моделью
site_url: https://digest.ninitux.com/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  # No Google Fonts: the stylesheet link is render-blocking and the CDN is
  # unreachable for the audience; the skin uses the system font stack anyway.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle: {icon: material/weather-sunny, name: Светлая тема}
  # The mascot, on every page. `.md-logo` is hidden by §6 of the skin for
  # the default Material logo; §16 puts this one back.
  logo: assets/hz-penguin.png
  favicon: assets/hz-penguin.png
  features:
    - navigation.instant
    - navigation.top
    # Without this the nav exists only inside `.md-sidebar--primary`, which the
    # skin hides — so the site rendered with no visible navigation at all and
    # the only way out of an article was the pager three screens down.
    - navigation.tabs

extra_css:
  - assets/horizon-digest.css

extra_javascript:
  - assets/horizon-search-redirect.js
  - assets/horizon-player.js

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html          # digests embed <details><ul> blocks in markdown
  - pymdownx.details
  - pymdownx.superfences
  - tables
  # Cyrillic headings slugged to `#_1`, `#_2` … with the default slugify: the
  # ids were unreadable and, worse, positional — reordering the sections of an
  # article silently repointed every link into it. pymdownx keeps the letters.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# The Jekyll site that used to live here belongs to upstream. Deleting those
# files would mean resolving a merge conflict every time upstream touches its
# own site, so they are excluded from the build instead.
#
# The project documentation pages are excluded too, deliberately: this site is
# the digest, not the project manual. The pages stay in the repo and readable
# on GitHub; publishing them here was rejected as clutter ("доставка Telegram,
# профили, куки — куча дополнительной ненужной информации").
exclude_docs: |
  _config.yml
  _includes/
  _posts/
  feed-*.xml
  assets/js/horizon.js
  assets/css/horizon.css
  configuration.md
  pipeline.md
  scrapers.md
  video-source.md
  telegram-delivery.md
  profiles.md
  scoring.md
  extractors.md
  twitter-cookies.md
  narration.md
  verification/

# Digest pages are generated per run and gitignored; they must not be listed
# individually in the nav, and MkDocs would otherwise warn about each one.
# The error page is `not-found.md`, not `404.md`: Material ships its own
# `404.html` template and it wins over a page of that name. Customising it the
# documented way means `theme.custom_dir`, and this project deliberately
# overrides no theme templates — so the page lives at its own address and the
# ingress rewrites errors to it (`handle_errors` in the Caddy site block).
not_in_nav: |
  digest/*
  not-found.md

# The digest table of contents links to raw `<a id="item-...">` anchors, which
# are not heading ids and therefore not in page.toc. That is deliberate — the
# ids are the deep-link contract with Telegram — so anchor validation must not
# fail the build over them.
validation:
  anchors: ignore

nav:
  - Главная: index.md
  # One name for one thing: the nav said "Дайджесты" while the page heading and
  # the button on the home page both said "Архив выпусков".
  - Архив выпусков: digest/index.md
  - Проверки: checks.md
  - Поиск: search.md
