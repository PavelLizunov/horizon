name: Deploy Docs

# Superseded by the self-hosted MkDocs site (see PLAN.md / deploy/README.md).
# Kept, not deleted, because this workflow is upstream's — and left on manual
# dispatch so an accidental docs/ push cannot republish the stale Jekyll site.
# The gh-pages branch exists but Pages does not publish it (verified: the URL
# 404s), so there is nothing to turn off in the repository settings.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
