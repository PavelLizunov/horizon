name: Deploy Site Preview

# A manual, public build of the MkDocs site. The production digest remains on
# its self-hosted deployment path; this preview is useful when that private
# deployment host is unavailable from the workstation.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build the MkDocs site
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
          mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
