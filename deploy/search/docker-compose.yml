# Reference/local archive-search topology: Elasticsearch plus a read-only
# shaping API. Elasticsearch is host-loopback-only; a pipeline on the same host
# can index through 127.0.0.1:9200 while ingress reaches only search-api.
# Current production uses separate systemd services; see README.md.
#
#   docker compose up -d          # first start
#   docker compose ps             # health
#
# Heap is pinned to 512 MB: the archive is a few hundred small documents,
# and ES defaults would eat gigabytes for nothing.

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  search-api:
    image: python:3.12-slim
    command: python /app/search_api.py
    volumes:
      - ./search_api.py:/app/search_api.py:ro
    environment:
      - ES_URL=http://es:9200
      - SEARCH_MAX_CONCURRENCY=${SEARCH_MAX_CONCURRENCY:-8}
      - SEARCH_REQUEST_TIMEOUT=${SEARCH_REQUEST_TIMEOUT:-15}
    # LAN-facing on purpose so the trusted Caddy ingress can proxy /api/search.
    # The API is read-only, bounded, and still intended to stay behind ingress.
    ports:
      - "8788:8788"
    depends_on:
      es:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata:
